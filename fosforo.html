:root{
  --fg:#41ff7a; --bg:#021006; --dim:rgba(65,255,122,.45); --glow:rgba(40,255,110,.55);
  --fonte:'VT323',monospace; --tam:28px; --entre:1.3; --largura:72ch; --brilho:1;
}
html[data-tema=ambar]{ --fg:#ffb21e; --bg:#130900; --dim:rgba(255,178,30,.45); --glow:rgba(255,140,0,.55); }
html[data-tema=branco]{ --fg:#e4ecff; --bg:#07090d; --dim:rgba(228,236,255,.42); --glow:rgba(170,195,255,.45); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--fg);overflow:hidden}
body{font-family:var(--fonte);font-size:var(--tam);-webkit-font-smoothing:antialiased}
::selection{background:var(--fg);color:var(--bg);text-shadow:none}

#tela{position:fixed;top:0;left:0;right:0;height:var(--alt,100%);background:radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--bg) 88%, var(--fg)) 0%, var(--bg) 70%, color-mix(in srgb, var(--bg) 30%, #000) 135%);
  text-shadow:0 0 calc(1.5px * var(--brilho)) var(--glow), 0 0 calc(9px * var(--brilho)) var(--glow);
  animation:ligar .55s ease-out}
@keyframes ligar{0%{transform:scale(1,.004);filter:brightness(4)}45%{transform:scale(1,.004)}100%{transform:scale(1,1);filter:none}}
.cintila #tela{animation:cint .09s infinite}
@keyframes cint{0%{opacity:.975}50%{opacity:1}100%{opacity:.985}}
#varredura,#vinheta{position:fixed;inset:0;pointer-events:none}
#varredura{z-index:60;background:repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.26) 2px 3px, transparent 3px 4px)}
#vinheta{z-index:61;background:radial-gradient(ellipse at center, transparent 67%, rgba(0,0,0,.46) 100%);box-shadow:inset 0 0 min(11vmin, 120px) rgba(0,0,0,.7)}
.sem-varredura #varredura,.sem-vinheta #vinheta{display:none}

#area{position:absolute;inset:env(safe-area-inset-top,0px) 0 calc(1.9em + env(safe-area-inset-bottom,0px)) 0;display:flex;justify-content:center}
.coluna{position:relative;width:min(var(--largura), calc(100% - 32px));height:100%}
.folha{font:inherit;line-height:var(--entre);letter-spacing:0;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;
  padding:1.6em 0 45vh 0;margin:0;border:0}
#editor{position:absolute;inset:0;width:100%;height:100%;background:transparent;color:var(--fg);outline:0;resize:none;
  caret-color:var(--fg);scrollbar-width:none;text-shadow:inherit}
#editor::-webkit-scrollbar{display:none}
#espelho{position:absolute;top:0;left:0;visibility:hidden;pointer-events:none}
#cursor{position:absolute;display:none;background:var(--fg);color:var(--bg);text-shadow:none;box-shadow:0 0 8px var(--glow);
  pointer-events:none;white-space:pre;overflow:hidden;opacity:.92}
#cursor.pisca{animation:piscar 1.06s steps(1) infinite}
@keyframes piscar{0%{opacity:.92}50%{opacity:0}}

#previa{position:absolute;inset:0;overflow:auto;display:none;padding:1.6em 0 30vh;line-height:var(--entre);scrollbar-width:none}
#previa h1,#previa h2,#previa h3,#previa h4{font-weight:normal;margin:.8em 0 .4em}
#previa h1{font-size:1.6em;text-transform:uppercase}#previa h2{font-size:1.3em}#previa h3{font-size:1.1em}
#previa h1::before{content:"# "}#previa h2::before{content:"## "}#previa h3::before{content:"### "}
#previa strong{font-weight:normal;background:var(--fg);color:var(--bg);text-shadow:none;padding:0 .2ch}
#previa em{font-style:normal;text-decoration:underline;text-underline-offset:.2em}
#previa blockquote{margin:0 0 0 1ch;padding-left:2ch;border-left:2px solid var(--dim)}
#previa code{color:var(--dim)} #previa pre{white-space:pre-wrap}
#previa hr{border:0;border-top:2px dashed var(--dim);margin:1.2em 0}
#previa a{color:inherit}
#previa p{margin:0 0 .8em}
.em-previa #previa{display:block}.em-previa #editor,.em-previa #cursor{display:none}

#status{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:1.9em;display:flex;align-items:center;gap:2ch;padding:0 max(16px,1.5ch);
  font-size:max(15px, calc(var(--tam) * .72));border-top:1px solid var(--dim);white-space:nowrap;transition:opacity .6s;color:var(--fg)}
#status .bt{cursor:pointer}
#status .esq,#status .dir{display:flex;gap:2ch;align-items:center;min-width:0}
#status .meio{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
#status .fraco{color:var(--dim)}
#s-titulo{overflow:hidden;text-overflow:ellipsis;max-width:32ch}
.digitando #status{opacity:.18}
.inverso{background:var(--fg);color:var(--bg);text-shadow:none;padding:0 .4ch}
@media (max-width:700px){ .so-largo{display:none} #status{gap:1.2ch} #s-titulo{max-width:14ch} }

#janela{position:fixed;top:0;left:0;right:0;height:var(--alt,100%);z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:16px}
#janela.aberta{display:flex}
.caixa{background:var(--bg);border:4px double var(--fg);box-shadow:0 0 22px var(--glow), inset 0 0 22px rgba(0,0,0,.6);
  width:min(64ch, 100%);max-height:88vh;display:flex;flex-direction:column;padding:.2em 0 .5em;font-size:clamp(17px, calc(var(--tam) * .82), 28px);line-height:1.3}
.caixa .tit{align-self:center;margin-top:-.9em;background:var(--bg);padding:0 1ch;letter-spacing:.08em}
.caixa .txt{padding:.4em 2ch .5em;white-space:pre-wrap;color:var(--fg)}
.caixa .txt.fraco{color:var(--dim)}
.caixa .filtro{padding:0 2ch .3em;color:var(--dim)}
.caixa .itens{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.caixa .item{display:flex;gap:2ch;padding:0 2ch;cursor:pointer;white-space:nowrap}
.caixa .item .tc{width:2ch;color:var(--dim)}
.caixa .item .rot{flex:1;overflow:hidden;text-overflow:ellipsis}
.caixa .item .dica{color:var(--dim)}

<script>
// Cópia do próprio HTML, tirada antes de qualquer mudança na página, para ir junto no .zip.
const FONTE_HTML = '<!doctype html>\n' + document.documentElement.outerHTML;
const NOME_HTML = (decodeURIComponent(location.pathname.split('/').pop() || '').match(/\.html?$/i) ? decodeURIComponent(location.pathname.split('/').pop()) : 'fosforo.html');

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
// Teclados de iPad muitas vezes não têm Esc; ⌘. faz o mesmo papel, como no próprio iPadOS.
const ehEsc = e => e.key === 'Escape' || (e.metaKey && e.key === '.');
const enc = new TextEncoder(), dec = new TextDecoder();
const ed = $('#editor'), espelho = $('#espelho'), cursorEl = $('#cursor');
function uid(){ return Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 6); }
function agora(){ const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 19); }
function hoje(){ return agora().slice(0, 10); }
function carimbo(){ return agora().replace('T', '_').replace(/:/g, '-'); }
const semAcento = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function slug(t){ return semAcento(t).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'sem-titulo'; }
function limparPasta(p){ return (p || '').replace(/[\/\\:*?"<>|]/g, '-').replace(/^\.+/, '').trim().slice(0, 60); }
function contar(t){ const p = t.match(/\S+/g); return { palavras: p ? p.length : 0, caracteres: t.length }; }
const fmtN = n => Math.round(n).toLocaleString('pt-BR');
function dataCurta(iso){ if (!iso) return ''; const [d, h] = iso.split('T'); const [a, m, dd] = d.split('-'); return `${dd}/${m}/${a.slice(2)} ${(h || '').slice(0, 5)}`; }
function hora(){ return agora().slice(11, 16); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const espera = ms => new Promise(r => setTimeout(r, ms));
function dispositivo(){
  let d = localStorage.getItem('fosforo.dispositivo');
  if (!d){ const p = /Mac/.test(navigator.platform) ? 'mac' : /Win/.test(navigator.platform) ? 'pc' : /iPhone|iPad/.test(navigator.userAgent) ? 'ios' : 'aparelho'; d = p + '-' + uid().slice(-4); localStorage.setItem('fosforo.dispositivo', d); }
  return d;
}
const DISP = dispositivo();

/* ---------- IndexedDB: identificador da pasta e modo navegador ---------- */
let _db;
function abrirIDB(){ return new Promise((ok, err) => { const r = indexedDB.open('fosforo', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('arquivos'); };
  r.onsuccess = () => ok(r.result); r.onerror = () => err(r.error); }); }
async function tx(loja, modo, fn){ _db = _db || await abrirIDB();
  return new Promise((ok, err) => { const t = _db.transaction(loja, modo); const r = fn(t.objectStore(loja));
    t.oncomplete = () => ok(r && r.result); t.onerror = () => err(t.error); }); }
const kv = { get: k => tx('kv', 'readonly', s => s.get(k)), set: (k, v) => tx('kv', 'readwrite', s => s.put(v, k)) };

/* ---------- armazenamento: pasta de verdade ou navegador ---------- */
class PastaFS {
  constructor(h){ this.raiz = h; this.nome = h.name; this.tipo = 'pasta'; }
  _partes(c){ return c.split('/').filter(Boolean); }
  async _dir(p, criar){ let h = this.raiz; for (const x of p) h = await h.getDirectoryHandle(x, { create: criar }); return h; }
  async _arq(c, criar){ const p = this._partes(c); const d = await this._dir(p.slice(0, -1), criar); return d.getFileHandle(p[p.length - 1], { create: criar }); }
  async ler(c, bin){ try { const f = await (await this._arq(c, false)).getFile(); return bin ? new Uint8Array(await f.arrayBuffer()) : await f.text(); }
    catch (e){ if (['NotFoundError', 'TypeMismatchError', 'NotReadableError'].includes(e.name)) return null; throw e; } }
  async info(c){ try { const f = await (await this._arq(c, false)).getFile(); return { mtime: f.lastModified, tam: f.size }; } catch (e){ return null; } }
  async gravar(c, dados){ const h = await this._arq(c, true); const w = await h.createWritable(); await w.write(dados); await w.close(); return (await h.getFile()).lastModified; }
  async apagar(c){ const p = this._partes(c); try { const d = await this._dir(p.slice(0, -1), false); await d.removeEntry(p[p.length - 1]); } catch (e){} }
  async listar(c){ try { const d = await this._dir(this._partes(c || ''), false); const r = [];
      for await (const [n, h] of d.entries()){ if (n.startsWith('.')) continue; r.push({ nome: n, tipo: h.kind === 'directory' ? 'dir' : 'arq' }); }
      return r; } catch (e){ return []; } }
}
class PastaNavegador {
  constructor(){ this.nome = 'navegador'; this.tipo = 'navegador'; }
  async ler(c, bin){ const v = await tx('arquivos', 'readonly', s => s.get(c)); if (!v) return null;
    if (bin) return typeof v.dados === 'string' ? enc.encode(v.dados) : v.dados;
    return typeof v.dados === 'string' ? v.dados : dec.decode(v.dados); }
  async info(c){ const v = await tx('arquivos', 'readonly', s => s.get(c)); return v ? { mtime: v.mtime, tam: v.dados.length } : null; }
  async gravar(c, dados){ const m = Date.now(); await tx('arquivos', 'readwrite', s => s.put({ dados, mtime: m }, c)); return m; }
  async apagar(c){ await tx('arquivos', 'readwrite', s => s.delete(c)); }
  async listar(c){ const pref = c ? c.replace(/\/?$/, '/') : ''; const ks = await tx('arquivos', 'readonly', s => s.getAllKeys()); const m = new Map();
    for (const k of ks){ if (!k.startsWith(pref)) continue; const r = k.slice(pref.length); const i = r.indexOf('/'); if (i < 0) m.set(r, 'arq'); else if (!m.has(r.slice(0, i))) m.set(r.slice(0, i), 'dir'); }
    return [...m].map(([nome, tipo]) => ({ nome, tipo })); }
}
async function percorrer(base, c = '', out = []){
  for (const e of await base.listar(c)){ const p = c ? c + '/' + e.nome : e.nome; if (e.tipo === 'dir') await percorrer(base, p, out); else out.push(p); }
  return out;
}

/* ---------- formato dos textos: Markdown com cabeçalho ---------- */
function analisar(txt){
  txt = txt.replace(/^﻿/, '');
  const m = txt.match(/^---\r?\n([\s\S]*?)\r?\n---[ \t]*(\r?\n|$)/); const meta = {}; let corpo = txt;
  if (m){ corpo = txt.slice(m[0].length); for (const l of m[1].split(/\r?\n/)){ const i = l.indexOf(':'); if (i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); } }
  return { meta, corpo };
}
function lerMeta(s){ const m = (s || '').match(/^(palavras|caracteres|minutos)\s+(\d+)/); return m ? { tipo: m[1], valor: +m[2] } : null; }
function montar(d){
  const l = ['---', `id: ${d.id}`, `titulo: ${String(d.titulo).replace(/\s+/g, ' ')}`, `criado: ${d.criado}`, `alterado: ${d.alterado}`];
  if (d.meta) l.push(`meta: ${d.meta.tipo} ${d.meta.valor}`);
  l.push('---', ''); return l.join('\n') + d.texto;
}

/* ---------- Markdown simples para a prévia e a exportação ---------- */
function inlineMd(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>').replace(/(^|[^\w])_([^_\s][^_]*?)_(?![\w])/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|mailto:|#)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t);
}
function md(src){
  const L = src.replace(/\r/g, '').split('\n'); const out = []; let i = 0;
  const inicioBloco = /^(#{1,6}\s|```|>|\s*[-*+]\s+|\s*\d+[.)]\s+)/;
  while (i < L.length){
    const l = L[i]; let m;
    if (/^```/.test(l)){ const b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out.push('<pre><code>' + esc(b.join('\n')) + '</code></pre>'); continue; }
    if (/^\s*$/.test(l)){ i++; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))){ out.push(`<h${m[1].length}>${inlineMd(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if (/^>/.test(l)){ const b = []; while (i < L.length && /^>/.test(L[i])) b.push(L[i++].replace(/^>\s?/, '')); out.push('<blockquote>' + md(b.join('\n')) + '</blockquote>'); continue; }
    if (/^\s*[-*+]\s+/.test(l)){ const b = []; while (i < L.length && /^\s*[-*+]\s+/.test(L[i])) b.push('<li>' + inlineMd(L[i++].replace(/^\s*[-*+]\s+/, '')) + '</li>'); out.push('<ul>' + b.join('') + '</ul>'); continue; }
    if (/^\s*\d+[.)]\s+/.test(l)){ const b = []; while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) b.push('<li>' + inlineMd(L[i++].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); out.push('<ol>' + b.join('') + '</ol>'); continue; }
    const b = [inlineMd(L[i++])];
    while (i < L.length && !/^\s*$/.test(L[i]) && !inicioBloco.test(L[i])) b.push(inlineMd(L[i++]));
    out.push('<p>' + b.join('<br>') + '</p>');
  }
  return out.join('\n');
}

/* ---------- zip (escrita e leitura, sem biblioteca) ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u){ let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function fluxo(u, t){ return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(t)).arrayBuffer()); }
async function criarZip(arqs){
  const partes = [], central = []; let off = 0; const d = new Date();
  const hora = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const data = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const a of arqs){
    const nome = enc.encode(a.nome), bruto = a.dados, crc = crc32(bruto);
    let met = 0, dados = bruto;
    if (window.CompressionStream && bruto.length > 64){ try { const c = await fluxo(bruto, new CompressionStream('deflate-raw')); if (c.length < bruto.length){ met = 8; dados = c; } } catch (e){} }
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, met, true);
    h.setUint16(10, hora, true); h.setUint16(12, data, true); h.setUint32(14, crc, true); h.setUint32(18, dados.length, true);
    h.setUint32(22, bruto.length, true); h.setUint16(26, nome.length, true); h.setUint16(28, 0, true);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, met, true);
    c.setUint16(12, hora, true); c.setUint16(14, data, true); c.setUint32(16, crc, true); c.setUint32(20, dados.length, true);
    c.setUint32(24, bruto.length, true); c.setUint16(28, nome.length, true); c.setUint32(42, off, true);
    partes.push(h, nome, dados); central.push(c, nome); off += 30 + nome.length + dados.length;
  }
  const tamC = central.reduce((s, x) => s + (x.byteLength), 0);
  const fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054b50, true); fim.setUint16(8, arqs.length, true); fim.setUint16(10, arqs.length, true);
  fim.setUint32(12, tamC, true); fim.setUint32(16, off, true);
  return new Blob([...partes, ...central, fim], { type: 'application/zip' });
}
async function lerZip(buf){
  const dv = new DataView(buf), u = new Uint8Array(buf); let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ e = i; break; }
  if (e < 0) throw new Error('Isso não parece um arquivo .zip.');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const out = [];
  for (let k = 0; k < n; k++){
    const met = dv.getUint16(p + 10, true), tc = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const nome = dec.decode(u.subarray(p + 46, p + 46 + nl)); p += 46 + nl + xl + cl;
    if (nome.endsWith('/')) continue;
    const ini = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true); let dados = u.slice(ini, ini + tc);
    if (met === 8) dados = await fluxo(dados, new DecompressionStream('deflate-raw')); else if (met !== 0) continue;
    out.push({ nome, dados });
  }
  return out;
}

/* ---------- configuração ---------- */
// A VT323 vem embutida; as outras letras são lidas de fontes/ na pasta de dados.
const SISTEMA = 'ui-monospace, Menlo, Consolas, monospace';
const NOMES_FONTES = { DroidSansMono: 'Droid Sans Mono', IBMPlexMono: 'IBM Plex Mono', CourierPrime: 'Courier Prime', ShareTechMono: 'Share Tech Mono' };
const FAIXAS = {
  'latin': 'U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD',
  'latin-ext': 'U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF'
};
let fontesPasta = [], fontesCarregadas = new Set();
const listaFontes = () => ['VT323', ...fontesPasta, 'Sistema'];
const cssFonte = n => n === 'Sistema' ? SISTEMA : `'${n}', 'VT323', ${SISTEMA}`;
async function carregarFontes(){
  fontesPasta = [];
  const grupos = new Map();
  for (const e of await B.listar('fontes')){
    const m = e.tipo === 'arq' && e.nome.match(/^(.+?)(?:-(latin-ext|latin))?\.(woff2|woff|ttf|otf)$/i); if (!m) continue;
    if (m[1] === 'VT323') continue;
    const nome = NOMES_FONTES[m[1]] || m[1].replace(/[-_]+/g, ' ');
    if (!grupos.has(nome)) grupos.set(nome, []);
    grupos.get(nome).push({ arq: e.nome, faixa: m[2] && FAIXAS[m[2].toLowerCase()] });
  }
  for (const [nome, arqs] of grupos){
    if (!fontesCarregadas.has(nome)){
      for (const a of arqs){
        const d = await B.ler('fontes/' + a.arq, true); if (!d) continue;
        try { const f = new FontFace(nome, d, a.faixa ? { unicodeRange: a.faixa } : {}); await f.load(); document.fonts.add(f); } catch (e){ console.warn('fonte', a.arq, e); }
      }
      fontesCarregadas.add(nome);
    }
    fontesPasta.push(nome);
  }
  fontesPasta.sort();
}
const PADRAO = { tema: 'verde', fonte: 'VT323', tamanho: 28, entrelinha: 1.3, largura: 72, sons: 'manual', volume: 50, brilho: 1,
  varredura: true, vinheta: true, cintilacao: false, bloco: true, maquina: true, hemingway: false, lembreteBackup: 7 };
let cfg = Object.assign({}, PADRAO, JSON.parse(localStorage.getItem('fosforo.cfg') || '{}'));
function aplicarCfg(){
  const r = document.documentElement, s = r.style;
  r.dataset.tema = cfg.tema;
  s.setProperty('--fonte', cssFonte(cfg.fonte)); s.setProperty('--tam', cfg.tamanho + 'px');
  s.setProperty('--entre', cfg.entrelinha); s.setProperty('--largura', cfg.largura + 'ch'); s.setProperty('--brilho', cfg.brilho);
  r.classList.toggle('sem-varredura', !cfg.varredura); r.classList.toggle('sem-vinheta', !cfg.vinheta); r.classList.toggle('cintila', cfg.cintilacao);
  ed.style.caretColor = cfg.bloco ? 'transparent' : 'var(--fg)';
  localStorage.setItem('fosforo.cfg', JSON.stringify(cfg));
  agendarCursor(); atualizarStatus();
}
let timerCfg;
function salvarCfg(){ aplicarCfg(); clearTimeout(timerCfg); timerCfg = setTimeout(() => B && B.gravar('config.json', JSON.stringify(cfg, null, 2)).catch(erro), 600); }

/* ---------- sons ---------- */

const Som = {
  ctx: null, buf: {}, carregado: '',
  iniciar(){
    if (!this.ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return false; this.ctx = new C();
      const r = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate), d = r.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this.ruido = r; }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (this.carregado !== cfg.sons) this.carregar(cfg.sons);
    return true;
  },
  async carregar(conj){
    this.carregado = conj; this.buf = {}; if (conj === 'desligado' || !this.ctx) return;
    const alias = conj === 'eletrica' ? 'electric' : 'manual', buf = {};
    const decodificar = async u8 => { try { return await this.ctx.decodeAudioData(u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength)); } catch (e){ return null; } };
    for (const n of ['key', 'space', 'return', 'bell', 'feed']){
      // Primeiro a pasta de dados, depois o que vem embutido; sem nenhum dos dois, sintetiza.
      if (B) for (const c of [`sons/${conj}/${n}`, `sons/${alias}_${n}`]) for (const ext of ['mp3', 'ogg', 'wav', 'm4a']){
        if (buf[n]) break;
        const d = await B.ler(`${c}.${ext}`, true).catch(() => null); if (d) buf[n] = await decodificar(d);
      }
      if (!buf[n] && conj === 'manual' && SONS_MANUAL[n]) buf[n] = await decodificar(Uint8Array.from(atob(SONS_MANUAL[n]), c => c.charCodeAt(0)));
    }
    if (this.carregado === conj) this.buf = buf;
  },
  tocar(tipo){
    if (cfg.sons === 'desligado' || !this.iniciar()) return;
    const b = this.buf[tipo];
    if (b){ const c = this.ctx, s = c.createBufferSource(), g = c.createGain(); s.buffer = b;
      if (tipo === 'key') s.playbackRate.value = 0.96 + Math.random() * 0.08;
      g.gain.value = cfg.volume / 100; s.connect(g).connect(c.destination); s.start(); return; }
    this.sint(tipo);
  },
  sint(tipo){
    const c = this.ctx, t = c.currentTime + 0.005, man = cfg.sons === 'manual', saida = c.createGain();
    saida.gain.value = cfg.volume / 100 * 0.9; saida.connect(c.destination);
    const estalo = (q0, f, dur, gan, Q = 1) => { const s = c.createBufferSource(); s.buffer = this.ruido; const fi = c.createBiquadFilter(); fi.type = 'bandpass'; fi.frequency.value = f; fi.Q.value = Q;
      const g = c.createGain(); g.gain.setValueAtTime(gan, q0); g.gain.exponentialRampToValueAtTime(0.001, q0 + dur); s.connect(fi).connect(g).connect(saida); s.start(q0, Math.random() * 0.5, dur + 0.02); };
    const baque = (q0, f, dur, gan) => { const o = c.createOscillator(); o.frequency.setValueAtTime(f, q0); o.frequency.exponentialRampToValueAtTime(f * 0.5, q0 + dur);
      const g = c.createGain(); g.gain.setValueAtTime(gan, q0); g.gain.exponentialRampToValueAtTime(0.001, q0 + dur); o.connect(g).connect(saida); o.start(q0); o.stop(q0 + dur + 0.02); };
    const sino = q0 => { for (const [f, a] of [[2093, 0.3], [4186, 0.1], [5470, 0.07]]){ const o = c.createOscillator(); o.frequency.value = f; const g = c.createGain();
      g.gain.setValueAtTime(a, q0); g.gain.exponentialRampToValueAtTime(0.001, q0 + 1.3); o.connect(g).connect(saida); o.start(q0); o.stop(q0 + 1.35); } };
    const r = 1 + (Math.random() - 0.5) * 0.18;
    if (tipo === 'key'){ if (man){ estalo(t, 2600 * r, 0.035, 0.9, 0.8); estalo(t + 0.011, 850 * r, 0.05, 0.55, 1.4); baque(t, 150 * r, 0.06, 0.45); }
                         else { estalo(t, 3900 * r, 0.018, 0.5, 1.2); baque(t, 230 * r, 0.03, 0.22); } }
    else if (tipo === 'space'){ if (man){ estalo(t, 1100 * r, 0.06, 0.8, 0.7); baque(t, 90, 0.1, 0.65); } else { estalo(t, 2000 * r, 0.03, 0.45, 1); baque(t, 120, 0.05, 0.3); } }
    else if (tipo === 'return'){
      if (man){ for (let i = 0; i < 9; i++) estalo(t + i * 0.028, 1700 + i * 70, 0.02, 0.4, 2); baque(t + 0.27, 110, 0.12, 0.75); estalo(t + 0.27, 700, 0.08, 0.9, 1); sino(t); }
      else { const s = c.createBufferSource(); s.buffer = this.ruido; const fi = c.createBiquadFilter(); fi.type = 'bandpass'; fi.Q.value = 3;
        fi.frequency.setValueAtTime(380, t); fi.frequency.linearRampToValueAtTime(1500, t + 0.25); const g = c.createGain();
        g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.5, t + 0.05); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
        s.connect(fi).connect(g).connect(saida); s.start(t, 0, 0.35); baque(t + 0.3, 140, 0.08, 0.45); } }
    else if (tipo === 'bell') sino(t);
    else if (tipo === 'feed') for (let i = 0; i < 14; i++) estalo(t + i * 0.035, 1500, 0.025, 0.35, 2);
  }
};

const J = $('#janela'); let janelaAberta = false;
function caixa(titulo){ J.innerHTML = ''; const c = document.createElement('div'); c.className = 'caixa'; const t = document.createElement('div'); t.className = 'tit'; t.textContent = ' ' + titulo + ' '; c.appendChild(t); J.appendChild(c); return c; }
function div(cls, txt){ const d = document.createElement('div'); d.className = cls; if (txt != null) d.textContent = txt; return d; }
function abrirJ(){ J.classList.add('aberta'); janelaAberta = true; ed.blur(); agendarCursor(); }
function fecharJ(){ J.classList.remove('aberta'); J.innerHTML = ''; janelaAberta = false; }

// Lista navegável: setas, Enter, tecla de atalho, filtro opcional.
function escolher(titulo, itens, o = {}){
  return new Promise(ok => {
    let sel = o.sel || 0, filtro = '';
    const lista = () => { let a = typeof itens === 'function' ? itens() : itens;
      if (filtro){ const f = semAcento(filtro); a = a.filter(x => semAcento(x.rotulo + ' ' + (x.dica || '')).includes(f)); } return a; };
    const desenhar = () => {
      const a = lista(); sel = Math.max(0, Math.min(sel, a.length - 1));
      const c = caixa(titulo);
      if (o.texto) c.appendChild(div('txt' + (o.textoFraco ? ' fraco' : ''), typeof o.texto === 'function' ? o.texto() : o.texto));
      if (o.filtro) c.appendChild(div('filtro', '> ' + filtro + '_'));
      const L = div('itens'); c.appendChild(L);
      a.forEach((x, i) => { const it = div('item' + (i === sel ? ' sel' : ''));
        if (a.some(y => y.tecla)) it.appendChild(div('tc', x.tecla || ''));
        it.appendChild(div('rot', x.rotulo)); if (x.dica) it.appendChild(div('dica', x.dica));
        it.onclick = () => { sel = i; escolhido(x); }; L.appendChild(it); });
      if (!a.length) L.appendChild(div('txt fraco', o.vazio || 'nada aqui'));
      const r = div('rodape'); const sp = document.createElement('span');

// Junta um backup ao que já existe, texto por texto, pelo id; o mais recente vence e o outro vira versão.
async function juntar(lista){
  const r = { novos: 0, atualizados: 0, mantidos: 0, iguais: 0 };
  const porId = new Map(docs.map(d => [d.id, d]));
  for (const x of lista){
    if (/^textos\/.+\.(md|txt|markdown)$/i.test(x.c)){
      const t = dec.decode(x.d), { meta, corpo } = analisar(t), local = meta.id && porId.get(meta.id);
      if (!local){
        const partes = x.c.split('/'), pasta = partes.length > 2 ? limparPasta(partes[1]) : '';
        const livre = await B.info(x.c) ? await caminhoLivre(pasta, slug(meta.titulo || partes.pop().replace(/\.[^.]+$/, ''))) : x.c;
        await B.gravar(livre, t); r.novos++; continue;
      }
      const tl = await B.ler(local.caminho) || '', ml = analisar(tl);
      if (ml.corpo === corpo && (ml.meta.titulo || '') === (meta.titulo || '')){ r.iguais++; continue; }
      if ((meta.alterado || '') > (ml.meta.alterado || '')){
        await B.gravar(`versoes/${local.id}/${carimbo()}-antes-de-juntar.md`, ml.corpo);
        await B.gravar(local.caminho, t); r.atualizados++;
      } else {
        await B.gravar(`versoes/${local.id}/${carimbo()}-de-fora.md`, corpo); r.mantidos++;
      }
    } else if (/^estatisticas\/.+\.json$/.test(x.c)){
      let a = {}, b = {}; try { a = JSON.parse(await B.ler(x.c) || '{}'); b = JSON.parse(dec.decode(x.d)); } catch (e){}
      for (const [k, v] of Object.entries(b)) a[k] = Math.max(a[k] || 0, v);
      await B.gravar(x.c, JSON.stringify(a));
    } else if (x.c === 'config.json'){
      continue; // nas junções, a configuração daqui fica
    } else if (!(await B.info(x.c))) await B.gravar(x.c, x.d);
  }
  return r;
}

sons/manual/ ou sons/eletrica/ (key, space, return, bell,
feed) valem mais. Sem nenhum, o som é sintetizado.`);
}

/* ---------- partida ---------- */
const boot = $('#boot');
async function digitar(linhas){ for (const l of linhas){ boot.textContent += l + '\n'; await espera(70); } }
async function escolherArmazenamento(podeVoltar){
  const suporta = 'showDirectoryPicker' in window;
  const h = suporta ? await kv.get('pasta').catch(() => null) : null;
  for (;;){
    const itens = [];
    if (h) itens.push({ tecla: 'R', rotulo: `Reabrir a pasta "${h.name}"`, valor: 'reabrir' });
    if (suporta) itens.push({ tecla: 'P', rotulo: (h ? 'Escolher outra pasta…' : 'Escolher a pasta de dados…'), valor: 'escolher' });
    itens.push({ tecla: 'N', rotulo: 'Guardar só neste navegador', valor: 'nav' });
    const op = await escolher('PASTA DE DADOS', itens, { semEsc: !podeVoltar, textoFraco: true,
      texto: suporta ? 'Escolha a pasta fosforo-dados, ao lado deste arquivo. Se ela estiver no iCloud Drive, os textos aparecem nos outros computadores.'
                     : 'Este navegador não deixa gravar numa pasta (só Chrome, Edge e parecidos deixam). Os textos ficam guardados no navegador; use Exportar > .zip para levar a outro lugar.' });
    if (!op) return null;
    try {
      if (op.valor === 'reabrir'){ if ((await h.requestPermission({ mode: 'readwrite' })) === 'granted'){ localStorage.setItem('fosforo.modo', 'pasta'); return new PastaFS(h); } }
      else if (op.valor === 'escolher'){ const n = await window.showDirectoryPicker({ id: 'fosforo', mode: 'readwrite' }); await kv.set('pasta', n); localStorage.setItem('fosforo.modo', 'pasta'); return new PastaFS(n); }
      else { localStorage.setItem('fosforo.modo', 'navegador'); return new PastaNavegador(); }
    } catch (e){ if (e.name !== 'AbortError') aviso(e.message); }
  }
}
async function criarBoasVindas(){
  const d = { id: uid(), titulo: 'Primeiras linhas', pasta: '', criado: agora(), alterado: agora(), meta: null,
    texto: 'Escreva aqui.\n\nESC abre o menu. Tudo é gravado sozinho enquanto você digita.\n\nApague estas linhas e comece.\n' };
  d.caminho = await caminhoLivre('', slug(d.titulo)); await B.gravar(d.caminho, montar(d)); delete d.texto; docs = [d]; await abrirDoc(d);
}
async function comecar(b){
  B = b; atual = null;
  try { const c = await B.ler('config.json'); if (c) cfg = Object.assign({}, PADRAO, JSON.parse(c)); } catch (e){}
  await carregarFontes().catch(e => console.warn(e));
  aplicarCfg(); await carregarEstat(); docs = await carregarLista();
  if (Som.ctx) Som.carregar(cfg.sons); else Som.carregado = '';
  boot.classList.add('fora');
  if (!docs.length) await criarBoasVindas();
  else { const u = localStorage.getItem('fosforo.ultimo'); await abrirDoc(docs.find(d => d.id === u) || docs.slice().sort((a, b) => (b.alterado || '').localeCompare(a.alterado || ''))[0]); }
  if (B.tipo === 'navegador'){
    // Pede ao navegador para não apagar os dados sozinho (o Safari apaga depois de dias sem uso, fora da Tela de Início).
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e){}
    if (precisaBackup()) aviso(`Último backup: ${descUltimoBackup()}. Toque em BACKUP! ou ESC > X > B.`, 9000);
  }
}
async function iniciar(){
  aplicarCfg();
  await digitar(['FÓSFORO 1.0', '', 'MEMÓRIA ........ OK', 'TECLADO ........ OK', 'FÓSFORO ........ ' + ({ verde: 'VERDE', ambar: 'ÂMBAR', branco: 'BRANCO' })[cfg.tema], '']);
  const modo = localStorage.getItem('fosforo.modo');
  try {
    if (modo === 'navegador') return await comecar(new PastaNavegador());
    if (modo === 'pasta' && 'showDirectoryPicker' in window){
      const h = await kv.get('pasta');
      if (h && (await h.queryPermission({ mode: 'readwrite' })) === 'granted') return await comecar(new PastaFS(h));
    }
  } catch (e){ console.warn(e); }
  await comecar(await escolherArmazenamento(false));
}
iniciar().catch(erro);
// Publicado num endereço https (GitHub Pages), o editor fica guardado no aparelho e abre sem internet.
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
